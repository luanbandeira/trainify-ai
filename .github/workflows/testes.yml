name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # torch CPU primeiro, para o pip não baixar os pacotes CUDA (~2 GB)
      - name: Dependências
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      # Os testes usam dublês da LLM e do modelo de embeddings: não precisam de chave nem de índice
      - name: Testes
        run: python -m pytest -q
        env:
          PRELOAD_EMBEDDINGS: "false"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes da conversa na interface
        run: node --test tests/chat_interface.test.cjs
